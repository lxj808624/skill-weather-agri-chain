# 美豆主产区：州 → 采样网格点（按大豆产量占全国比重加权）
# 权重来源：USDA NASS 各州大豆产量长期占比（2020-2024 五年均值，四舍五入到整数）
regions:
  - name: Illinois
    code: IL
    weight: 14
    points:                    # (lat, lon) 覆盖主产县带，避免只用州府单点
      - [40.48, -88.95]
      - [41.60, -93.50]
      - [38.95, -89.10]
  - name: Iowa
    code: IA
    weight: 14
    points:
      - [42.03, -93.65]
      - [41.90, -95.35]
      - [43.10, -92.30]
  - name: Nebraska
    code: NE
    weight: 7
    points:
      - [40.80, -96.68]
      - [41.60, -99.10]
      - [42.20, -97.60]
  - name: Minnesota
    code: MN
    weight: 8
    points:
      - [44.00, -93.20]
      - [45.60, -95.00]
      - [46.50, -94.20]

variables:
  - precipitation_sum
  - temperature_2m_mean
  - temperature_2m_max

# 生长季定义（玉米带大豆）：播种 5 月，关键鼓粒期 7-8 月
growing_season:
  start_month: 5
  end_month: 9
  critical_months: [7, 8]

start_date: "2010-01-01"
forecast_start_date: "2016-01-01"   # 归档预报仅回溯到 2016，实测 2010 返回 400
end_date: "2025-10-31"
